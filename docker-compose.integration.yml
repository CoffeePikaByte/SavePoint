services:
  postgres:
    image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
    restart: "no"
    environment:
      POSTGRES_USER: spit_admin
      POSTGRES_PASSWORD: ${SAVEPOINT_TEST_PASSWORD:?Generated by the test script}
      POSTGRES_DB: spit_${SAVEPOINT_TEST_RUN_ID:?Generated by the test script}
    labels:
      io.savepoint.integration.run: ${SAVEPOINT_TEST_RUN_ID}
    ports:
      - target: 5432
        host_ip: 127.0.0.1
        protocol: tcp
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 1s
      timeout: 3s
      retries: 60
    stop_grace_period: 10s
networks:
  default:
    labels:
      io.savepoint.integration.run: ${SAVEPOINT_TEST_RUN_ID}
